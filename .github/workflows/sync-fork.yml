name: Sync fork with upstream

on:
  schedule:
    # 每天 UTC 0 点（北京时间早上 8 点）自动同步一次
    - cron: '0 0 * * *'
  workflow_dispatch:   # 支持在 Actions 页面手动点击触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream
        uses: tgymnich/fork-sync@v2.0
        with:
          owner: morluto        # 上游仓库的用户名
          repo: rea             # 上游仓库名
          base: main            # 上游仓库的默认分支（若为 master 就改成 master）
          head: main            # 你 fork 里的分支（通常同名）
          merge_method: merge   # 合并方式：merge / rebase / squash
          token: ${{ secrets.GITHUB_TOKEN }}
